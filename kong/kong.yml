_format_version: "3.0"
_transform: true

services:
  - name: retodevops-service
    url: http://nginx:80
    routes:
      - name: devops-route
        paths:
          - /DevOps
        methods:
          - POST
        strip_path: false

plugins:
  - name: key-auth
    service: retodevops-service
    config:
      key_names:
        - X-Parse-REST-API-Key
      hide_credentials: false

  - name: jwt
    service: retodevops-service
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
      header_names:
        - X-JWT-KWY
      secret_is_base64: false

consumers:
  - username: devops-consumer
    keyauth_credentials:
      - key: 2f5ae96c-b558-4c7b-a590-a501ae1c3f6c
    jwt_secrets:
      - algorithm: HS256
        key: devops-consumer-key
        secret: devops-reto-secret-key-2024-super-secure
